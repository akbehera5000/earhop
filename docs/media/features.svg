<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-label="EarHop features: automatic earbud switching, universal clipboard and file sharing between Mac, Windows and Android">
<title>EarHop features</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07060d"/><stop offset="1" stop-color="#000"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1530"/><stop offset="1" stop-color="#0c0b14"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9f7bff" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#4d9eff" stop-opacity=".8"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#b59bff" stop-opacity=".8"/><stop offset="1" stop-color="#7a52ff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="500" rx="28" fill="url(#bg)"/>
<g font-family="-apple-system, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif"><g><rect x="40" y="40" width="380" height="330" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="1.4"/><rect x="41" y="41" width="378" height="60" rx="25" fill="url(#sheen)"/><g transform="translate(40,40)"><g transform="translate(110,150) scale(1.05)"><rect x="-46" y="-34" width="92" height="60" rx="6" fill="#16141f" stroke="#3b3550" stroke-width="1.5"/><rect x="-40" y="-28" width="80" height="48" rx="3" fill="#5b3bd6" opacity=".55"/><path d="M-58,26 H58 L64,33 H-64 Z" fill="#b9b9c8"/></g><g transform="translate(275,150) scale(1.05)"><rect x="-20" y="-38" width="40" height="76" rx="8" fill="#16141f" stroke="#3b3550" stroke-width="1.5"/><rect x="-16" y="-33" width="32" height="66" rx="5" fill="#5b3bd6" opacity=".55"/></g><g><g><circle r="26" fill="url(#glow)"/><g transform="translate(-9,-2) rotate(-14)"><ellipse rx="7" ry="6.2" fill="#fff"/><rect x="-2.1" y="2" width="4.2" height="11" rx="2.1" fill="#e6e7ef"/><circle cx="4" cy=".5" r="2.4" fill="#9f7bff"/></g><g transform="translate(9,-2) rotate(14) scale(-1,1)"><ellipse rx="7" ry="6.2" fill="#fff"/><rect x="-2.1" y="2" width="4.2" height="11" rx="2.1" fill="#e6e7ef"/><circle cx="4" cy=".5" r="2.4" fill="#4d9eff"/></g></g><animateMotion dur="5s" repeatCount="indefinite" path="M110,92 Q192,10 275,92 Q192,10 110,92" keyPoints="0;0;0.5;0.5;1" keyTimes="0;0.2;0.5;0.7;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.2 1;0 0 1 1;0.45 0 0.2 1"/></g></g><text x="68" y="268" font-size="24" font-weight="700" fill="#fff">Earbuds that follow you</text><text x="68" y="300" font-size="15.5" fill="#b9b2d6"><tspan x="68" dy="0">Play on any device and your AirPods Pro 2</tspan><tspan x="68" dy="23">or Galaxy Buds2 Pro switch to it. The</tspan><tspan x="68" dy="23">other device pauses by itself.</tspan></text></g><g><rect x="450" y="40" width="380" height="330" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="1.4"/><rect x="451" y="41" width="378" height="60" rx="25" fill="url(#sheen)"/><g transform="translate(450,40)"><g transform="translate(95,150) scale(1.05)"><rect x="-20" y="-38" width="40" height="76" rx="8" fill="#16141f" stroke="#3b3550" stroke-width="1.5"/><rect x="-16" y="-33" width="32" height="66" rx="5" fill="#173a7a" opacity=".55"/></g><g transform="translate(268,140) scale(1.05)"><rect x="-52" y="-38" width="104" height="66" rx="5" fill="#16141f" stroke="#3b3550" stroke-width="1.5"/><rect x="-46" y="-32" width="92" height="54" rx="3" fill="#5b3bd6" opacity=".6"/><path d="M-8,28 h16 l4,12 h-24 z" fill="#b9b9c8"/><rect x="-24" y="39" width="48" height="5" rx="2.5" fill="#b9b9c8"/></g><g><g><rect x="-17" y="-21" width="34" height="42" rx="5" fill="#f1edff"/><rect x="-8" y="-25" width="16" height="8" rx="3" fill="#9f7bff"/><rect x="-10" y="-7" width="20" height="3" rx="1.5" fill="#9f7bff" opacity=".7"/><rect x="-10" y="0" width="16" height="3" rx="1.5" fill="#9f7bff" opacity=".5"/><rect x="-10" y="7" width="18" height="3" rx="1.5" fill="#9f7bff" opacity=".35"/></g><animateMotion dur="4s" repeatCount="indefinite" path="M95,140 Q180,40 268,128" keyPoints="0;0;1;1" keyTimes="0;0.15;0.6;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1"/><animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.12;0.6;0.85;1" dur="4s" repeatCount="indefinite"/></g><g opacity="0"><text x="268" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Pasted</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.66;0.9;1" dur="4s" repeatCount="indefinite"/></g></g><text x="478" y="268" font-size="24" font-weight="700" fill="#fff">Copy here, paste there</text><text x="478" y="300" font-size="15.5" fill="#b9b2d6"><tspan x="478" dy="0">Text, links and images you copy appear</tspan><tspan x="478" dy="23">on your other devices. Encrypted with</tspan><tspan x="478" dy="23">your own key, never sent to a cloud.</tspan></text></g><g><rect x="860" y="40" width="380" height="330" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="1.4"/><rect x="861" y="41" width="378" height="60" rx="25" fill="url(#sheen)"/><g transform="translate(860,40)"><g transform="translate(100,150) scale(1.05)"><rect x="-46" y="-34" width="92" height="60" rx="6" fill="#16141f" stroke="#3b3550" stroke-width="1.5"/><rect x="-40" y="-28" width="80" height="48" rx="3" fill="#173a7a" opacity=".55"/><path d="M-58,26 H58 L64,33 H-64 Z" fill="#b9b9c8"/></g><g transform="translate(280,150) scale(1.05)"><rect x="-20" y="-38" width="40" height="76" rx="8" fill="#16141f" stroke="#3b3550" stroke-width="1.5"/><rect x="-16" y="-33" width="32" height="66" rx="5" fill="#5b3bd6" opacity=".55"/></g><g opacity="0"><path d="M-12,-16 h15 l9,9 v23 h-24 z" fill="#9fd0ff"/><path d="M3,-16 v9 h9" fill="#ffffff" opacity=".6"/><animateMotion dur="3.6s" begin="0s" repeatCount="indefinite" path="M100,130 Q190,20 280,120" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="3.6s" begin="0s" repeatCount="indefinite"/></g><g opacity="0"><path d="M-12,-16 h15 l9,9 v23 h-24 z" fill="#c9b8ff"/><path d="M3,-16 v9 h9" fill="#ffffff" opacity=".6"/><animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M100,130 Q190,20 280,120" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></g><g opacity="0"><path d="M-12,-16 h15 l9,9 v23 h-24 z" fill="#9ff0c8"/><path d="M3,-16 v9 h9" fill="#ffffff" opacity=".6"/><animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite" path="M100,130 Q190,20 280,120" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></g></g><text x="888" y="268" font-size="24" font-weight="700" fill="#fff">Send files in a tap</text><text x="888" y="300" font-size="15.5" fill="#b9b2d6"><tspan x="888" dy="0">Photos and documents go between Mac,</tspan><tspan x="888" dy="23">Windows and Android over your own</tspan><tspan x="888" dy="23">Wi-Fi. No cables, no uploads.</tspan></text></g><rect x="210" y="406" width="110" height="38" rx="19" fill="#120f1d" stroke="url(#edge)" stroke-width="1.2"/><circle cx="230" cy="425" r="5" fill="#30D158"/><text x="242" y="430" font-size="15" font-weight="600" fill="#e3ddff">No cloud</text><rect x="332" y="406" width="126" height="38" rx="19" fill="#120f1d" stroke="url(#edge)" stroke-width="1.2"/><circle cx="352" cy="425" r="5" fill="#30D158"/><text x="364" y="430" font-size="15" font-weight="600" fill="#e3ddff">No account</text><rect x="470" y="406" width="208" height="38" rx="19" fill="#120f1d" stroke="url(#edge)" stroke-width="1.2"/><circle cx="490" cy="425" r="5" fill="#30D158"/><text x="502" y="430" font-size="15" font-weight="600" fill="#e3ddff">Free and open source</text><rect x="690" y="406" width="380" height="38" rx="19" fill="#120f1d" stroke="url(#edge)" stroke-width="1.2"/><circle cx="710" cy="425" r="5" fill="#30D158"/><text x="722" y="430" font-size="15" font-weight="600" fill="#e3ddff">Works offline on your Wi-Fi and Bluetooth</text></g>
</svg>